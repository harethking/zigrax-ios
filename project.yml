name: ZIGRAX
options:
  bundleIdPrefix: com.hareth
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
settings:
  base:
    MARKETING_VERSION: "1.0.18"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: $(ZX_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
targets:
  ZIGRAX:
    type: application
    platform: iOS
    sources:
      - path: ZIGRAX
      - path: www
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: ZIGRAX/Info.plist
      properties:
        CFBundleDisplayName: "زيغراكس"
        CFBundleName: ZIGRAX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBg
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "يحتاج زيغراكس الميكروفون فقط عندما تسجّل رسالة صوتية لصديقك."
        NSCameraUsageDescription: "يحتاج زيغراكس الكاميرا فقط إذا اخترت التقاط صورة لإرسالها أو لصورة حسابك."
        NSPhotoLibraryUsageDescription: "يحتاج زيغراكس الصور فقط عندما تختار صورة لإرسالها أو لصورة حسابك."
        NSUserTrackingUsageDescription: "نستخدم هذا المعرّف لعرض إعلانات أنسب لك. يمكنك الرفض وستظهر لك إعلانات عامة."
        GADApplicationIdentifier: $(ZX_ADMOB_APP_ID)
        ZXAdUnits:
          puzzle_hint: $(ZX_AD_REWARDED)
          opening_hint: $(ZX_AD_REWARDED)
        CFBundleURLTypes:
          - CFBundleURLName: com.hareth.zigrax.links
            CFBundleURLSchemes: [zigrax]
