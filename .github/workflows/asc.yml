name: App Store Connect

on:
  push:
    branches: [main]
    paths: [".asc-run"]
  workflow_dispatch:
    inputs:
      mode:
        description: "setup, submit or release"
        default: setup

permissions:
  contents: write

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MODE: ${{ inputs.mode }}
        run: |
          sudo gem install fastlane -N --quiet >/dev/null
          mkdir -p ~/k && printf '%s' "$ASC_KEY_P8" > ~/k/AuthKey.p8
          [ -n "$MODE" ] || MODE=$(head -1 .asc-run | tr -d '[:space:]')
          echo "mode $MODE"
          ASC_KEY_PATH=~/k/AuthKey.p8 ruby scripts/asc.rb "$MODE" 2>&1 | tee asc-result.txt; echo "exit ${PIPESTATUS[0]} $(date -u)" >> asc-result.txt
      - if: always()
        run: |
          rm -rf ~/k
          git config user.name "zigrax-ci"; git config user.email "zigrax-ci@users.noreply.github.com"
          git add asc-result.txt && git commit -qm "asc result [skip ci]" && git push -q || true
