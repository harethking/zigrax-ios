name: Check secrets
on:
  push:
    paths: [".github/workflows/check-secrets.yml", ".secrets-check"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the four App Store secrets (prints only OK / WRONG, never the values)
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          ok=1
          chk() { if [ "$2" = 1 ]; then echo "OK     $1"; else echo "WRONG  $1"; ok=0; fi; }
          chk ASC_KEY_ID    $( [[ "$KID" =~ ^[A-Z0-9]{10}$ ]] && echo 1 || echo 0 )
          chk ASC_ISSUER_ID $( [[ "$ISS" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] && echo 1 || echo 0 )
          chk APPLE_TEAM_ID $( [[ "$TEAM" =~ ^[A-Z0-9]{10}$ ]] && echo 1 || echo 0 )
          printf '%s' "$P8" > k.p8
          chk ASC_KEY_P8    $( grep -q "BEGIN PRIVATE KEY" k.p8 && grep -q "END PRIVATE KEY" k.p8 && openssl pkey -in k.p8 -noout 2>/dev/null && echo 1 || echo 0 )
          rm -f k.p8
          [ $ok = 1 ]
