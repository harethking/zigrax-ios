name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Build a signed version and upload it to App Store Connect (TestFlight)"
        type: boolean
        default: false

jobs:
  simulator:
    name: Build and self-test on the simulator
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ZIGRAX.xcodeproj -scheme ZIGRAX -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80
      - name: Run the app with the self-test
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "device $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/ZIGRAX.app
          xcrun simctl launch "$DEV" com.hareth.zigrax -zxSelfTest
          DATA=$(xcrun simctl get_app_container "$DEV" com.hareth.zigrax data)
          for i in $(seq 1 90); do [ -f "$DATA/Documents/selftest.json" ] && break; sleep 2; done
          echo "waited $((i*2))s"
          sleep 2
          xcrun simctl io "$DEV" screenshot screen-home.png
          sips -Z 520 -s format jpeg -s formatOptions 60 screen-home.png --out shot.jpg >/dev/null
          echo "SHOT_BEGIN"; base64 -i shot.jpg | tr -d '\n'; echo; echo "SHOT_END"
          [ -f "$DATA/Documents/selftest.json" ] || { echo "no self-test result"; exit 1; }
          echo "ZXSELFTEST $(cat "$DATA/Documents/selftest.json")" | tee result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-test
          path: |
            selftest.log
            result.txt
            screen-*.png

  upload:
    name: Signed build to App Store Connect
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    needs: simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey.p8
      - name: Archive
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project ZIGRAX.xcodeproj -scheme ZIGRAX -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ZIGRAX.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            ZX_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60
      - name: Upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ZIGRAX.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Clean up the key
        if: always()
        run: rm -rf ~/private_keys
